[project]
name = "Multi Vendor Ecommerce API"
dynamic = ["version"]
requires-python = ">= 3.13"
authors = [
  {name = "Kazi Khaled Nur", email = "kazikhalednur@gmail.com"},
]
readme = "README.md"
license = {text = "BSD-3-Clause"}

[project.urls]
Source = "https://github.com/kazimdkhalednur/ecommerce-api"

[tool.black]
target-version = ["py313"]
line-length = 88
exclude = ".*/(migrations|venv|migrations_generated)/.*"

[tool.isort]
profile = "black"
default_section = "THIRDPARTY"
known_first_party = "django"
extend_skip = "migrations_generated"
